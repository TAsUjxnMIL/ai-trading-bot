services:
  api:
    build: .
    working_dir: /app/src
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - ${ENV_FILE:-./.env.demo}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data

  worker:
    build: .
    working_dir: /app/src
    command: ["python", "worker.py"]
    environment:
      - PYTHONPATH=/app/src
    env_file:
      - ${ENV_FILE:-./.env.demo}
    volumes:
      - ./data:/app/data
